name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'
  SITE_URL: https://ibaraki-dev-website.ba068082.workers.dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:worker
      - run: npm run build
      - run: node scripts/check-seo.mjs
      - name: Validate Worker bundle without credentials
        run: npm exec -- wrangler deploy --dry-run --outdir output/worker

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      github.repository == 'Ibaraki-dev/ibaraki.dev' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ibaraki-dev-website.ba068082.workers.dev
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-seo.mjs
      - name: Ignore superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api repos/Ibaraki-dev/ibaraki.dev/git/ref/heads/main --jq '.object.sha')"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure Cloudflare credentials in the production Environment.'
            exit 1
          fi
          npm exec -- wrangler deploy
      - name: Verify production
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/check-worker.mjs "$SITE_URL"
